<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio X - Animated Logo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030303; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            flex-direction: column; 
        }

        .main-lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 
           SCALER WRAPPER
           Logo internal size: 800px.
           Target size: 300px (Medium).
           Scale: 300 / 800 = 0.375
        */
        .logo-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px; /* Space between logo and text */
        }
        
        .logo-scaler {
            position: absolute;
            top: 0; left: 0;
            width: 800px; height: 800px;
            transform: scale(0.375);
            transform-origin: top left;
        }

        /* INTERNAL LOGO CSS */
        .logo-container {
            position: relative;
            width: 800px;
            height: 800px;
            background: transparent;
            /* Clipping for neat badge look */
            overflow: hidden; 
            /* border-radius: 40px; */ /* Optional soft edges */
            /* Masking edges for smoother fade? */
            -webkit-mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
            mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
        }

        /* TEXT */
        .brand-text {
            color: white;
            font-size: 2.5rem; 
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0;
            text-transform: uppercase;
            text-align: center;
            opacity: 0; 
            line-height: 1;
        }
        
        .brand-text .highlight {
            color: #00d2ff;
            font-weight: 800;
        }

        /* LOGO INTERNALS (Thinner Version from Step 169) */
        .strip-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .strip-content {
            position: absolute;
            width: 4000px; 
            height: 200px;
            display: block; 
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
        }

        /* Thinner dimensions */
        .video-item {
            position: absolute;
            width: 160px; 
            height: 90px;
            top: 50%;
            transform: translateY(-50%); 
            object-fit: cover;
            border-radius: 3px; 
            filter: contrast(1.1) brightness(0.9);
        }

        svg.logo-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            filter: drop-shadow(0 0 20px rgba(0,0,0,1)); 
        }

        .play-button-group {
            pointer-events: auto;
            cursor: pointer;
        }
        .play-button-group:hover { transform: scale(1.1); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        :root { --neon-blue: #00d2ff; }
    </style>
</head>
<body>

    <div class="main-lockup">
        
        <!-- LOGO -->
        <div class="logo-wrapper">
            <div class="logo-scaler">
                <div class="logo-container"> <!-- Now clipped -->
                    
                    <!-- STRIP 1 (45deg) -->
                    <div class="strip-layer" style="transform: rotate(45deg); z-index: 1;">
                        <div id="track-1" class="strip-content"></div>
                    </div>
                    <!-- STRIP 2 (-45deg) -->
                    <div class="strip-layer" style="transform: rotate(-45deg); z-index: 2;">
                        <div id="track-2" class="strip-content"></div>
                    </div>

                    <!-- SVG OVERLAY -->
                    <svg class="logo-svg" viewBox="0 0 800 800">
                        <defs>
                            <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#007aff;stop-opacity:1" />
                            </linearGradient>
                            <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.4" />
                                <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0" />
                            </radialGradient>
                            <mask id="film-mask" maskUnits="userSpaceOnUse">
                                <rect x="-2000" y="-2000" width="4000" height="4000" fill="white" />
                                <g id="mask-holes"></g>
                            </mask>
                        </defs>

                        <!-- Thinner geometry: Y=330, Height=140 -->
                        <g id="svg-strip-1" transform="rotate(45, 400, 400)">
                             <rect x="-1000" y="330" width="2800" height="140" fill="url(#neon-gradient)" mask="url(#film-mask)" />
                             <g id="sprockets-1"></g>
                        </g>

                        <g id="svg-strip-2" transform="rotate(-45, 400, 400)">
                             <rect x="-1000" y="330" width="2800" height="140" fill="url(#neon-gradient)" mask="url(#film-mask)" />
                             <g id="sprockets-2"></g>
                        </g>

                        <g class="play-button-group" transform="translate(400,400)">
                            <circle r="80" fill="url(#center-glow)" />
                            <circle r="55" fill="#0a0a0a" stroke="url(#neon-gradient)" stroke-width="2" />
                            <path d="M-8,-14 L20,0 L-8,14 Z" fill="#fff" filter="drop-shadow(0 0 10px #00d2ff)" />
                            <circle id="pulse-ring" r="55" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.8" />
                        </g>
                    </svg>
                </div>
            </div>
        </div>

        <!-- TEXT -->
        <h1 class="brand-text">StudioX <span class="highlight">AI</span></h1>

    </div>

    <script>
        const videoSources = [
            "assets/sarah%20video.mp4",
            "https://pub-d8add5c3ed1e4923aa87c457caea356d.r2.dev/Stop%20Scrolling_Fnl_2%20(1).mp4",
            "assets/Rosa_Video%201.mp4",
            "https://pub-d8add5c3ed1e4923aa87c457caea356d.r2.dev/rose.mp4"
        ];
        
        // Thinner Unit: 160 + 20 = 180
        const unitW = 180; 
        const patternW = unitW * videoSources.length; 
        const numUnits = 20;
        
        const track1 = document.getElementById('track-1');
        const track2 = document.getElementById('track-2');
        const maskHoles = document.getElementById('mask-holes');
        const sprockets1 = document.getElementById('sprockets-1');
        const sprockets2 = document.getElementById('sprockets-2');

        const xStart = 400 - (numUnits * unitW) / 2; 
        const trackCenter = 2000;
        const globalCenter = 400;

        for(let i=0; i<numUnits; i++) {
            let x = xStart + i * unitW; 
            const cssLeft = trackCenter + (x - globalCenter);
            const appendVid = (track, offset) => {
                const vid = document.createElement('video');
                vid.className = 'video-item';
                vid.autoplay = true; vid.muted = true; vid.loop = true; vid.playsInline = true;
                vid.src = videoSources[(i + offset) % videoSources.length];
                vid.style.left = cssLeft + 'px';
                track.appendChild(vid);
            };
            appendVid(track1, 0);
            appendVid(track2, 1);

            // Thinner Hole: Y=355, H=90
            const hole = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            hole.setAttribute("x", x);
            hole.setAttribute("y", 355);
            hole.setAttribute("width", 160);
            hole.setAttribute("height", 90);
            hole.setAttribute("rx", "3");
            hole.setAttribute("fill", "black");
            maskHoles.appendChild(hole);

            const addSprocket = (gid, y) => {
                for(let s=0; s<8; s++) {
                     const sx = x + s*22 + 4;
                     const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                     r.setAttribute("x", sx);
                     r.setAttribute("y", y);
                     r.setAttribute("width", 10);
                     r.setAttribute("height", 10);
                     r.setAttribute("rx", "2");
                     r.setAttribute("fill", "white");
                     gid.appendChild(r);
                }
            };
            // Thinner Sprocket Ys
            addSprocket(sprockets1, 338);
            addSprocket(sprockets1, 452);
            addSprocket(sprockets2, 338);
            addSprocket(sprockets2, 452);
        }

        // --- ANIMATION ---
        const tl = gsap.timeline();
        
        // 1. ENTRANCE
        tl.from(".logo-scaler", { scale: 0, opacity:0, duration: 1.5, ease:"power4.out"}, "start");
        tl.to(".brand-text", { opacity: 1, y: -10, duration: 1, ease: "power2.out" }, "start+=1.2");

        // Internal
        tl.from("#svg-strip-1", { duration: 1.5, attr: { transform: "rotate(45, 400, 400) translate(-1000, 0)" }, ease: "power4.out" }, "start"); 
        tl.from("#svg-strip-2", { duration: 1.5, attr: { transform: "rotate(-45, 400, 400) translate(1000, 0)" }, ease: "power4.out" }, "start");
        tl.from("#track-1", { duration: 1.5, x: -1000, ease: "power4.out" }, "start");
        tl.from("#track-2", { duration: 1.5, x: 1000, ease: "power4.out" }, "start");
        tl.from(".play-button-group", { scale: 0, rotation: 180, duration: 1, ease: "back.out" }, "-=1");

        // 2. LOOP
        gsap.delayedCall(1.5, () => {
             startLoop();
        });

        function startLoop() {
            const duration = 2; 
            gsap.to("#track-1", {
                x: "+=" + patternW, 
                duration: duration * 4, 
                ease: "none", repeat: -1,
                modifiers: { x: gsap.utils.unitize(x => parseFloat(x) % patternW) }
            });
            gsap.to("#track-2", {
                x: "-=" + patternW,
                duration: duration * 4,
                ease: "none", repeat: -1,
                modifiers: { x: gsap.utils.unitize(x => parseFloat(x) % patternW) }
            });
        }

        gsap.to("#pulse-ring", { scale: 1.5, opacity: 0, duration: 2, repeat: -1 });

    </script>
</body>
</html>
